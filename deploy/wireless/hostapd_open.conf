# TEMPORARY diagnostic AP: same radio settings as hostapd.conf but with NO encryption. RUNS ON THE JETSON.
#
# Purpose: separate a crypto/key-handling fault from a radio fault. The desktop dongle is fine as a client
# of a phone hotspot (0% loss over 2 min), so if this open AP delivers pings steadily while the WPA2 one
# stalls, hardware crypto in the Jetson dongle driver is the cause (fix: rt2800usb nohwcrypt=1).
#
# SECURITY: an open AP bridged onto the robot LAN lets anyone in range join 192.168.123.x. Run it only for
# the test, with the robot not being commanded, and stop it afterwards (sudo pkill hostapd).
#
# Different SSID from the secured AP so the desktop cannot mix the two profiles up.
# hostapd does NOT support trailing comments; keep every comment on its own line.

interface=wlan0
bridge=br0
driver=nl80211

ssid=go_2_rl_open
country_code=DE
hw_mode=g
channel=6
ieee80211n=0
disassoc_low_ack=0
wmm_enabled=1

auth_algs=1
macaddr_acl=0
ignore_broadcast_ssid=0
