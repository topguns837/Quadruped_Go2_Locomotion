# Real-hardware deployment config for the obs_stacking (iter5) policy: 6-frame history, kp/kd 50/1.0, a 10 Hz
# joint_vel observation EMA filter, and the height command. Use this config with --config for that policy;
# go2_locomotion.yaml stays the config for the current single-frame kp40 policy.
#
# Values here (default joint pose, PD gains, action scale) are copied directly from the sim actuator
# config that trained these policies (unitree_go2witharm_cfg.py's UNITREE_GO2WITHARM_CFG, and
# quadruped_go2_locomotion_env_cfg.py's ActionsCfg) -- NOT generic "reasonable Go2 defaults". The policy
# was calibrated against this exact stiffness/damping/scale combination; using different real-hardware PD
# gains would silently change what each action value means to the robot.

policy_path: models/11_18_26_iter4_realistic/exported/policy.pt  # PLACEHOLDER: replace with the
  # obs_stacking export once trained (logs/rsl_rl/go2_kp50_iter5_hist6/run_iter5_hist6/exported/policy.pt). A 288-dim
  # (48x6) actor; deploy auto-checks 288 == 48 x history_length(6) via policy_obs_layout.  # JIT export -- takes the raw
  # observation vector and returns actions directly (obs normalization baked in). NOT model_2699.pt (that's
  # the full RSL-RL training checkpoint -- actor+critic+optimizer state, needs rsl_rl's ActorCritic class to
  # load, unnecessary weight/dependency for pure inference). See deploy.md's export-format note.
  #
  # 47-dim policy (no base_lin_vel) from the DR-curriculum retrain (run go2_kp40_curriculum_ppo/
  # 2026-11-03_22-14-59, 18k iterations total). NOT yet tried on hardware; sim2sim only. Expect a lower stance
  # and foot skim -- see docs/gait_realism_diagnosis.md. The previous hardware-tested policy is
  # models/10_14_26_real_hardware_parity_tested/ (50-dim; swap policy_path back to use it).
history_length: 6  # observation frames the policy was trained with (ObservationsCfg.HISTORY_LENGTH). The actor
                   # input is 48 (per frame) x 6 = 288; policy_obs_layout errors if this doesn't match the export.
joint_vel_filter_hz: 10.0  # EMA low-pass cutoff on the joint_vel observation, matching the training obs filter
                           # (mdp.JointVelFiltered cutoff_hz). None/omit = off. Keeps the policy's joint_vel input
                           # the same in sim and on hardware -- the noise-resilience fix, not the action low-pass.

control_dt: 0.02  # 50 Hz -- matches training's decimation(4) * sim.dt(0.005), see quadruped_go2_locomotion_env_cfg.py

network_interface: null  # REQUIRED before first run -- the HOST NIC on the robot's 192.168.123.0/24 network.
                          # Wired: the cabled NIC, e.g. "enp3s0" (deploy.md Stage 0). Wireless: the desktop
                          # WiFi interface, e.g. "wlan0"/"wlxXXXX", once it has associated with the robot's
                          # bridged AP and taken a static 192.168.123.x address (deploy.md Stage 0b;
                          # deploy/wireless/). The container is network_mode: host, so use the HOST interface
                          # name. Left null so a real run refuses to start unset (fails loud, not with a
                          # silent wrong-interface bind).

link_lost_after: 0.5  # Seconds of LowState silence before the run stops as link-lost (and damps, never
                      # resumes). 0.5 s suits the wired link's ~500 Hz stream; for a jittery WiFi link, check
                      # the end-of-run "[LINK] LowState gaps" summary (max/p95) and raise cautiously if real
                      # gaps approach it. Overridable per-run with --link_lost_after.

# --- action scale/offset (from ActionsCfg: mdp.JointPositionActionCfg(scale=0.25, use_default_offset=True)) ---
action_scale: 0.25

# --- per-joint PD gains (from UNITREE_GO2WITHARM_CFG's DCMotorCfg groups) ---
# kp/kd really are identical across all 12 joints in sim, so there's no per-joint variation to carry over.
kp: 50.0  # MUST equal the training actuator stiffness (unitree_go2witharm_cfg.py DCMotorCfg.stiffness). Raised
          # 25 -> 40 (2026-10-30): kp=25 could not hold the stance on hardware (legs sagged at handover). The
          # policy's action->torque mapping is learned at this gain, so deploy and training must match.
kd: 1.0   # = training damping (unitree_go2witharm_cfg.py DCMotorCfg.damping), raised 0.5 -> 0.8 with kp.

# hold_kp -- stiffness used ONLY for the startup ramp that raises the robot to the default stance, BEFORE the
# policy loop takes over. The policy loop itself always runs at `kp` above (its trained gain). kp=25 is the
# training gain and is held in the loop by the policy actively commanding an offset every tick -- it is NOT
# stiff enough to passively raise/hold the robot's full weight on the ground during the cold start, so the
# legs sag (rear knees first) and the ramp never reaches the stance. A stiffer hold_kp lets the robot actually
# stand up to default; deploy_real.py then drops kp to `kp` in the same tick the first policy action is applied,
# so the policy's active hold takes over before the robot can sag. Set to kp to restore the old behaviour.
hold_kp: 60.0  # ramp-lift stiffness (>= kp): kp is now 50, so the old 40 would be softer than the policy loop. The
               # still ramps kp 0 -> hold_kp gently; with hold_kp == kp the handover kp-fade is effectively a
               # no-op. Raise above kp only if a retrained policy still sags during the startup lift.

# effort_limit is NOT a copy of the sim actuator limit any more, and must not be "corrected" to match it.
# UNITREE_GO2WITHARM_CFG now uses the real per-joint values (hip/thigh 23.7 Nm, calf 45.43 Nm -- the calf has a
# 1.9169:1 knee reduction). This value is used on hardware only as a SAFETY threshold: deploy_real.py derives
# its torque abort at 0.9 * effort_limit (~21 Nm, see the TorqueResponseWatchdog wiring and Checklist phase H),
# and the Go2's own rated hip/thigh torque is 23.7 Nm. Raising it to 45.43 would weaken that abort by ~2x
# across every joint, including the hip and thigh that cannot deliver it. Left deliberately at 23.5.
effort_limit: 23.5

# --- joint order, Isaac Lab side (the order this policy's action vector is in) ---
# CONFIRMED ground truth via `deploy/dump_joint_order.py` (run this session against the real loaded asset,
# `env.scene["robot"].joint_names`) -- NOT the placeholder guess this used to be. The real order groups by
# joint TYPE across all four legs (all hips, then all thighs, then all calves), each in FL/FR/RL/RR order --
# structurally different from the per-leg grouping (FL_hip,FL_thigh,FL_calf,FR_hip,...) the placeholder
# assumed. Re-run dump_joint_order.py if the asset/USD ever changes; this list must always match exactly.
isaac_joint_order:
  - FL_hip_joint
  - FR_hip_joint
  - RL_hip_joint
  - RR_hip_joint
  - FL_thigh_joint
  - FR_thigh_joint
  - RL_thigh_joint
  - RR_thigh_joint
  - FL_calf_joint
  - FR_calf_joint
  - RL_calf_joint
  - RR_calf_joint

# Default (standing) joint position per joint name, in radians -- from
# UNITREE_GO2WITHARM_CFG.init_state.joint_pos. The action the policy outputs is an OFFSET from these values
# (scaled by action_scale above), not an absolute target.
default_joint_pos:
  FL_hip_joint: 0.1
  FR_hip_joint: -0.1
  RL_hip_joint: 0.1
  RR_hip_joint: -0.1
  FL_thigh_joint: 0.8
  FR_thigh_joint: 0.8
  RL_thigh_joint: 1.0
  RR_thigh_joint: 1.0
  FL_calf_joint: -1.5
  FR_calf_joint: -1.5
  RL_calf_joint: -1.5
  RR_calf_joint: -1.5

# --- Unitree SDK LowCmd/LowState motor index order (the OTHER order deploy_real.py must reconcile) ---
# CONFIRMED this session directly against unitree_sdk2py's own reference example
# (example/go2/low_level/unitree_legged_const.py, fetched and read verbatim -- not just "standard
# convention" as previously noted): FR(0,1,2), FL(3,4,5), RR(6,7,8), RL(9,10,11), each triplet
# (hip, thigh, calf), unchanged across the A1/Go1/Go2/B1 SDK generations. Still worth a final sanity check
# against your specific unit's firmware docs before first use, but this is sourced, not guessed.
sdk_joint_order:
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint

# No height entry here, and nothing to configure for it: height is not a command or observation any more
# (there is no reliable way to measure it on real hardware). The robot is only ever held near a fixed
# default stance height by a training-side reward (RewardsCfg.height_penalty). See mdp/commands.py's
# module docstring for the full rationale.
