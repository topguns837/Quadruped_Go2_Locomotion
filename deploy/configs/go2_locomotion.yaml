# Real-hardware deployment config for the vanilla / experimental Go2 policies.
#
# Values here (default joint pose, PD gains, action scale) are copied directly from the sim actuator
# config that trained these policies (unitree_go2witharm_cfg.py's UNITREE_GO2WITHARM_CFG, and
# quadruped_go2_locomotion_env_cfg.py's ActionsCfg) -- NOT generic "reasonable Go2 defaults". The policy
# was calibrated against this exact stiffness/damping/scale combination; using different real-hardware PD
# gains would silently change what each action value means to the robot.

policy_path: models/9_13_26_pitch_lean_height_weights_experimental/exported/policy.pt  # JIT export -- takes
  # the raw observation vector and returns actions directly (obs normalization baked in). NOT model_17999.pt
  # (that's the full RSL-RL training checkpoint -- actor+critic+optimizer state, needs rsl_rl's ActorCritic
  # class to load, unnecessary weight/dependency for pure inference). See deploy.md's export-format note.
  #
  # STALE as of the calf-actuator and height/mass fixes: this 52-dim policy was trained against the old
  # 23.5 Nm calf limit, the old 6-wide/base_height observation, and the imu/radar phantom mass -- none of
  # which the current training config reproduces any more. deploy_real.py's observation builder is now
  # 50-dim-only on its real-hardware path (no base_height branch is exercised there), so pointing this at
  # the file above will fail loudly with a matrix-shape error, not run with silently wrong behavior. Update
  # this to the new policy's exported/policy.pt once retrained.
control_dt: 0.02  # 50 Hz -- matches training's decimation(4) * sim.dt(0.005), see quadruped_go2_locomotion_env_cfg.py

network_interface: null  # REQUIRED before first run -- e.g. "enp3s0" (host NIC cabled to the robot). See
                          # deploy.md Stage 0 ("ifconfig" after connecting). Left null so a real run refuses
                          # to start unset (fails loud, not with a silent wrong-interface bind).

# --- action scale/offset (from ActionsCfg: mdp.JointPositionActionCfg(scale=0.25, use_default_offset=True)) ---
action_scale: 0.25

# --- per-joint PD gains (from UNITREE_GO2WITHARM_CFG's DCMotorCfg groups) ---
# kp/kd really are identical across all 12 joints in sim, so there's no per-joint variation to carry over.
kp: 25.0
kd: 0.5

# effort_limit is NOT a copy of the sim actuator limit any more, and must not be "corrected" to match it.
# UNITREE_GO2WITHARM_CFG now uses the real per-joint values (hip/thigh 23.7 Nm, calf 45.43 Nm -- the calf has a
# 1.9169:1 knee reduction). This value is used on hardware only as a SAFETY threshold: deploy_real.py derives
# its torque abort at 0.9 * effort_limit (~21 Nm, see the TorqueResponseWatchdog wiring and Checklist phase H),
# and the Go2's own rated hip/thigh torque is 23.7 Nm. Raising it to 45.43 would weaken that abort by ~2x
# across every joint, including the hip and thigh that cannot deliver it. Left deliberately at 23.5.
effort_limit: 23.5

# --- joint order, Isaac Lab side (the order this policy's action vector is in) ---
# CONFIRMED ground truth via `deploy/dump_joint_order.py` (run this session against the real loaded asset,
# `env.scene["robot"].joint_names`) -- NOT the placeholder guess this used to be. The real order groups by
# joint TYPE across all four legs (all hips, then all thighs, then all calves), each in FL/FR/RL/RR order --
# structurally different from the per-leg grouping (FL_hip,FL_thigh,FL_calf,FR_hip,...) the placeholder
# assumed. Re-run dump_joint_order.py if the asset/USD ever changes; this list must always match exactly.
isaac_joint_order:
  - FL_hip_joint
  - FR_hip_joint
  - RL_hip_joint
  - RR_hip_joint
  - FL_thigh_joint
  - FR_thigh_joint
  - RL_thigh_joint
  - RR_thigh_joint
  - FL_calf_joint
  - FR_calf_joint
  - RL_calf_joint
  - RR_calf_joint

# Default (standing) joint position per joint name, in radians -- from
# UNITREE_GO2WITHARM_CFG.init_state.joint_pos. The action the policy outputs is an OFFSET from these values
# (scaled by action_scale above), not an absolute target.
default_joint_pos:
  FL_hip_joint: 0.1
  FR_hip_joint: -0.1
  RL_hip_joint: 0.1
  RR_hip_joint: -0.1
  FL_thigh_joint: 0.8
  FR_thigh_joint: 0.8
  RL_thigh_joint: 1.0
  RR_thigh_joint: 1.0
  FL_calf_joint: -1.5
  FR_calf_joint: -1.5
  RL_calf_joint: -1.5
  RR_calf_joint: -1.5

# --- Unitree SDK LowCmd/LowState motor index order (the OTHER order deploy_real.py must reconcile) ---
# CONFIRMED this session directly against unitree_sdk2py's own reference example
# (example/go2/low_level/unitree_legged_const.py, fetched and read verbatim -- not just "standard
# convention" as previously noted): FR(0,1,2), FL(3,4,5), RR(6,7,8), RL(9,10,11), each triplet
# (hip, thigh, calf), unchanged across the A1/Go1/Go2/B1 SDK generations. Still worth a final sanity check
# against your specific unit's firmware docs before first use, but this is sourced, not guessed.
sdk_joint_order:
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint

# No height entry here, and nothing to configure for it: height is not a command or observation any more
# (there is no reliable way to measure it on real hardware). The robot is only ever held near a fixed
# default stance height by a training-side reward (RewardsCfg.height_penalty). See mdp/commands.py's
# module docstring for the full rationale.
