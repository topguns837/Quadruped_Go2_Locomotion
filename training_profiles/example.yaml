# Training profile: annotated TEMPLATE -- a complete, self-contained config snapshot.
#
# Convention: the top-level `overrides` lists EVERY tunable value (even ones equal to the Python default), so the
# whole training config is auditable in this one file. Each phase lists only what it CHANGES from that baseline.
# Effective config of a phase = baseline `overrides` + that phase's `overrides` (phase wins).
#
# An override is any Hydra-reachable field on env.* or agent.*. Precedence at run time:
#   explicit CLI (train_phased.sh --num_envs/--seed or a trailing key=value)  >  phase  >  baseline  >  code.
# Copy this file to training_profiles/<your_name>.yaml and edit.  Validate without launching:
#   bash scripts/train_phased.sh --profile example --dry_run
#
# ---------------------------------------------------------------------------------------------------------------
# FIXED IN CODE -- NOT overridable in a profile (loading a profile that sets one FAILS): kp, kd, JOINT_ARMATURE,
# PHYSX_JOINT_SPEED_LIMIT, observation history_length, network hidden dims / activation, num_steps_per_env.
# Current values: kp 40.0, kd 0.8, armature 0.01, speed clamp 500 (disabled), history 1, hidden [256,512,128] elu.
# ---------------------------------------------------------------------------------------------------------------

experiment_name: go2_example        # logs/rsl_rl/<experiment_name>/<run_dir>/ ; folder for this profile's runs
run_dir: run_example                # fixed run folder shared by all phases (so they resume one another)
task: Quadruped-Locomotion-Go2      # gym id to train
num_envs: 2048                      # parallel environments; overridden by --num_envs
seed: null                          # null = train_batched.sh default; overridden by --seed

# Live graphs while training: train_batched.sh (re)starts scripts/live_dashboard.py at the start of every batch and
# opens feh on its PNG -- no separate tmux dashboard / viewer panes needed. CLI: --no_dashboard, --no_viewer,
# --dashboard_output PATH override these per run.
dashboard: true                       # run the live dashboard (writes a PNG every ~0.5 s)
viewer: true                          # open a feh window on that PNG (needs DISPLAY + feh; else skipped)
dashboard_output: /tmp/dashboard.png  # PNG the dashboard writes and feh shows

# Complete baseline (shown at the current iter4-realistic defaults). Every value, even defaults.
overrides:
  # --- disturbances / domain randomisation (EventCfg); magnitudes curriculum-scaled by env.difficulty_scale ---
  env.events.push_robot_force.params.max_force: 15.0          # N: random external force field on the base
  env.events.push_robot_force.params.max_torque: 2.0          # Nm: random external torque on the base
  env.events.push_robot.params.max_velocity: 0.5              # m/s: instantaneous velocity kick to the base
  env.events.robot_mass.params.mass_distribution_params: [-2.0, 2.0]          # kg added to the base (payload spread)
  env.events.robot_com.params.max_xyz: [0.06, 0.05, 0.08]                     # m: base centre-of-mass offset (x,y,z)
  env.events.actuator_gains.params.stiffness_distribution_params: [0.9, 1.1]  # x kp (actuator stiffness error)
  env.events.actuator_gains.params.damping_distribution_params: [0.9, 1.1]    # x kd (actuator damping error)
  env.events.joint_armature.params.armature_distribution_params: [0.75, 1.5]  # x nominal JOINT_ARMATURE (rotor inertia)
  env.events.joint_friction.params.friction_distribution_params: [0.0, 0.1]   # Nm: absolute dry joint friction
  env.events.physics_material.params.static_friction_range: [0.5, 1.2]        # ground static friction coefficient
  env.events.physics_material.params.dynamic_friction_range: [0.4, 1.0]       # ground sliding friction coefficient
  # To DISABLE a disturbance term for a phase, set it to null:  env.events.push_robot_force: null

  # --- difficulty curriculum (CurriculumCfg.difficulty): scales the disturbances above from 0 -> full strength ---
  env.curriculum.difficulty.params.step: 0.025               # difficulty increment per window (bigger = faster ramp)
  env.curriculum.difficulty.params.up_thresh: 0.8            # raise difficulty if >= this fraction of episodes time out
  env.curriculum.difficulty.params.down_thresh: 0.4          # lower difficulty if <= this fraction time out (else fell)
  env.curriculum.difficulty.params.dwell_steps: 6000         # env steps per difficulty window (24 per PPO iteration)
  env.curriculum.difficulty.params.settle_steps: 2000        # steps ignored after a change (skip episodes begun at old)
  env.curriculum.difficulty.params.min_episodes: 500         # min ended episodes before difficulty may move

  # --- reward weights (RewardsCfg); positive = reward, negative = penalty ---
  env.rewards.track_lin_vel_xy_exp.weight: 6.0               # match commanded x/y velocity (tight exp kernel)
  env.rewards.track_lin_vel_xy_broad.weight: 4.0            # match x/y velocity (wide kernel: gradient when far off)
  env.rewards.track_ang_vel_z_exp.weight: 1.2              # match commanded yaw rate (tight)
  env.rewards.track_ang_vel_z_broad.weight: 0.8           # match yaw rate (wide kernel)
  env.rewards.standing_when_commanded.weight: -4.0        # penalty for moving under a zero command
  env.rewards.track_ang_vel_deficit.weight: -0.5          # penalty for under-shooting the commanded yaw rate
  env.rewards.track_pitch_exp.weight: 3.0                 # match commanded pitch angle (ang_pos_y)
  env.rewards.track_lean_exp.weight: 3.0                  # match commanded lean/roll angle (ang_pos_x)
  env.rewards.lin_vel_z_l2.weight: -2.0                   # penalty for vertical bob (z velocity)
  env.rewards.ang_vel_xy_l2.weight: -0.05                 # penalty for roll/pitch body wobble
  env.rewards.dof_torques_l2.weight: -3.0e-5             # penalty on joint torque magnitude (energy/smoothness)
  env.rewards.dof_acc_l2.weight: -5.0e-7                 # penalty on joint acceleration
  env.rewards.action_rate_l2.weight: -0.03               # penalty on action change between steps (smoothness)
  env.rewards.dof_vel_l2.weight: -1.0e-4                 # penalty on joint velocity magnitude
  env.rewards.action_jerk_l2.weight: -0.03               # penalty on 2nd difference of action (anti-buzz)
  env.rewards.joint_torque_rate_l2.weight: -1.0e-3       # penalty on change in applied torque (anti-chatter)
  env.rewards.is_alive.weight: 2.0                       # per-step bonus for not terminating
  env.rewards.termination_penalty.weight: -750.0         # one-off penalty on a fall / termination
  env.rewards.undesired_contacts.weight: -1.0            # penalty for calf / head touching the ground
  env.rewards.undesired_contacts_arm.weight: -1.0        # penalty for arm links touching anything
  env.rewards.height_penalty.weight: -15.0               # L1 penalty on base-height deviation from the default stance
  env.rewards.hip_crossing.weight: -0.5                  # penalty for the legs crossing (hip past neutral)
  env.rewards.foot_sliding.weight: -1.0                  # penalty for a foot slipping while in contact
  env.rewards.gait_coordination.weight: 1.0              # dense trot-phasing reward (scaled by command magnitude)
  env.rewards.stand_still.weight: 5.0                    # reward holding the default stance under a zero command
  env.rewards.foot_lift.weight: 0.5                      # reward lifting swing feet to clear the ground
  env.rewards.dof_pos_limits.weight: -1.0                # penalty for joints near their position limits
  env.rewards.joint_deviation.weight: -0.005             # penalty for straying from the default joint pose

  # --- commands (CommandsCfg.base_velocity): what the policy is asked to track ---
  env.commands.base_velocity.rel_standing_envs: 0.2          # fraction of envs given an all-zero command
  env.commands.base_velocity.resampling_time_range: [10.0, 10.0]   # s between new command samples (min, max)
  env.commands.base_velocity.rel_low_speed_envs: 0.35        # fraction of moving envs oversampled at low speed
  env.commands.base_velocity.low_speed_max: 0.3              # m/s threshold defining "low speed" for that oversample
  env.commands.base_velocity.ranges.lin_vel_x: [-1.0, 1.0]   # m/s forward/back command range
  env.commands.base_velocity.ranges.lin_vel_y: [-1.0, 1.0]   # m/s lateral command range
  env.commands.base_velocity.ranges.ang_vel_z: [-1.0, 1.0]   # rad/s yaw-rate command range
  env.commands.base_velocity.ranges.ang_pos_x: [-0.3, 0.3]   # rad lean (roll) command range
  env.commands.base_velocity.ranges.ang_pos_y: [-0.6, 0.6]   # rad pitch command range

  # --- agent / PPO (rsl_rl_ppo_cfg) ---
  agent.algorithm.learning_rate: 1.0e-3      # PPO learning rate (adaptive, retuned toward desired_kl each update)
  agent.algorithm.gamma: 0.99                # reward discount factor
  agent.algorithm.lam: 0.95                  # GAE lambda (bias/variance of advantage estimates)
  agent.algorithm.entropy_coef: 0.0075       # exploration bonus (higher = more random actions)
  agent.algorithm.clip_param: 0.2            # PPO clip epsilon (policy-update trust region)
  agent.algorithm.value_loss_coef: 0.5       # weight of the critic (value) loss
  agent.algorithm.desired_kl: 0.01           # target KL that the adaptive learning rate tracks
  agent.algorithm.num_learning_epochs: 5     # optimiser passes over each rollout
  agent.algorithm.num_mini_batches: 4        # minibatches per epoch
  agent.save_interval: 100                   # checkpoint every N iterations

phases:
  - name: single
    iterations: 1000           # total PPO iterations for this phase
    batched: true              # restart the process in chunks to free RAM/VRAM between them (omit for one run)
    batch_iterations: 500      # iterations per chunk; required when batched: true; must be <= iterations
    # num_envs: 1024           # optional per-phase override of the top-level num_envs
    # seed: 42                 # optional per-phase seed
    overrides:                 # only the values this phase changes from the baseline above
      env.curriculum.difficulty.params.step: 0.05   # ramp difficulty faster in this phase
