#
# See docker/README.md for setup (NGC login, EULA, X11) and usage.
#
# Interactive work goes through ./start.sh, not `docker compose run`/`up`
# directly: the helper scripts under docker/ always kill and recreate this
# container before opening a shell, so there is only ever one project
# container at a time. `command: sleep infinity` below just keeps a freshly
# started container alive long enough for `docker exec` to attach into it.

services:
  quadruped-go2:
    build:
      context: ./docker
      dockerfile: Dockerfile
      target: app
      args:
        ISAACSIM_VERSION: ${ISAACSIM_VERSION:-5.1.0}
        ISAACLAB_VERSION: ${ISAACLAB_VERSION:-v2.3.2}
    image: quadruped_go2_locomotion:latest
    container_name: quadruped_go2_locomotion
    command: ["sleep", "infinity"]
    environment:
      - ACCEPT_EULA=Y
      - OMNI_KIT_ALLOW_ROOT=1
      - DISPLAY=${DISPLAY}
      - TERM
      - QT_X11_NO_MITSHM=1
      # See the XAUTHORITY volume mount below for why this is needed
      # alongside DISPLAY for a native GUI window to actually render.
      - XAUTHORITY=/root/.Xauthority
    volumes:
      # Everything project-specific is mounted, never baked into the image:
      # source code, scripts, USD/USDA assets, and training logs/checkpoints
      # all live on the host and are picked up immediately, no rebuild needed.
      - .:/workspace/quadruped_go2_locomotion
      # X11 passthrough for the Isaac Sim GUI (run `xhost +local:docker` on
      # the host first, see docker/README.md)
      - /tmp/.X11-unix:/tmp/.X11-unix
      # `xhost +local:docker` alone is enough for basic X11 protocol access,
      # but not for Vulkan to actually present to a window: without the
      # host's own auth cookie, swapchain creation failed with
      # `vkCreateSwapchainKHR failed` / `advanceCurrentFrame: backbuffers are
      # not initialized!` even with /dev/dri passed through (confirmed
      # directly: neither fix alone was sufficient, only both together).
      # Requires XAUTHORITY to be set on the host (true for both X11 and
      # XWayland desktop sessions; GDM in particular sets it under
      # /run/user/<uid>/gdm/Xauthority, not the traditional ~/.Xauthority).
      - ${XAUTHORITY}:/root/.Xauthority:ro
      - /etc/localtime:/etc/localtime:ro
      # Isaac Sim caches, persisted across container restarts so shaders/assets
      # aren't recompiled or re-downloaded every run
      - isaac-cache-kit:/isaac-sim/kit/cache
      - isaac-cache-ov:/root/.cache/ov
      - isaac-cache-pip:/root/.cache/pip
      - isaac-cache-gl:/root/.cache/nvidia/GLCache
      - isaac-cache-compute:/root/.nv/ComputeCache
      - isaac-logs:/root/.nvidia-omniverse/logs
      - isaac-data:/root/.local/share/ov/data
    network_mode: host
    devices:
      # NVIDIA's compute-oriented devices (/dev/nvidia0, nvidiactl, etc, from
      # the `deploy.resources` GPU reservation below) are enough for physics
      # and rendering compute, but a native GUI window additionally needs the
      # DRM/KMS device for Vulkan to negotiate buffer sharing with the host's
      # X server when presenting to a window. Without it, every native-window
      # run failed identically (confirmed directly with vkcube, a minimal
      # reference Vulkan app, independent of Isaac Sim: swapchain creation
      # crashed with `demo_prepare_buffers: Assertion '!err' failed` and Isaac
      # Sim logged `vkCreateSwapchainKHR failed` / `advanceCurrentFrame:
      # backbuffers are not initialized!`; passing this device fixed both).
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # "gpu" alone doesn't include NVENC/NVDEC hardware video
              # encoding, which the WebRTC livestream needs to actually push
              # frames to a connected client (observed directly: rendering
              # and physics ran fine, but nvstPushStreamData failed and
              # nvidia-smi showed 0 active encoder sessions the whole time).
              # "graphics" alone is also not enough for a native GUI window:
              # it only makes the OpenGL/Vulkan/EGL libraries available, not
              # X11/GLX output access, which is what NVIDIA Container
              # Toolkit's separate "display" capability governs. Without it,
              # this exact list (missing only "display") reproduced the same
              # swapchain failure as the plain compute-only default, while a
              # bare `--gpus all` (which falls back to this image's baked-in
              # NVIDIA_DRIVER_CAPABILITIES=all, so implicitly includes
              # "display") worked. Confirmed directly: adding "display" here
              # was the one remaining change needed for vkcube (and then
              # Isaac Sim) to render into a native window.
              capabilities: [gpu, video, graphics, compute, utility, display]
    stdin_open: true
    tty: true

volumes:
  isaac-cache-kit:
  isaac-cache-ov:
  isaac-cache-pip:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-logs:
  isaac-data:
