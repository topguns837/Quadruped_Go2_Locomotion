# Training profile: "aggressive" -- the earlier high-disturbance domain-randomisation config (pre-iter4).
#
# The strong-push regime used before the 2026-11-08 "realistic" retune: external force +-40 N / torque +-5 Nm,
# base mass +-5 kg, wide COM and armature spread, faster difficulty step, and the softer posture/fall weights of
# that era. At 40 N (~26% of the robot's weight) held for seconds the policy learned to crouch and leave the
# default pose to avoid falling -- which is why it was reduced. Kept here for reproducibility; prefer
# `iter4_realistic` for hardware-bound policies.
#
# Complete, self-contained snapshot (every value present). The values that are HISTORICALLY DISTINCT to the
# aggressive era are marked [AGGR]; the rest match the current defaults (the pre-iter4 reward-weight history is
# not all recoverable, so only the recorded deltas are reproduced -- everything else is today's baseline).
#   bash src/training/train.sh --profile aggressive [--dry_run]
#
# ---------------------------------------------------------------------------------------------------------------
# FIXED IN CODE (not overridable here): kp=40.0, kd=0.8, JOINT_ARMATURE=0.01, PHYSX_JOINT_SPEED_LIMIT=500,
# observation history_length=1, hidden dims [256,512,128], activation elu, num_steps_per_env 24.
# ---------------------------------------------------------------------------------------------------------------

# How many training phases this profile runs. It must equal the number of entries under `phases:` below
# (1 = a single-phase run; a profile with `num_phases: 4` needs four phase entries). `train.sh --num_phases K`
# runs only the first K of them.
num_phases: 2

experiment_name: go2_kp40_aggressive
run_dir: run_aggressive
task: Quadruped-Locomotion-Go2
num_envs: 2048
seed: null

# Live graphs while training: train_batched.sh (re)starts src/common/live_dashboard.py at the start of every batch and
# opens feh on its PNG -- no separate tmux dashboard / viewer panes needed. CLI: --no_dashboard, --no_viewer,
# --dashboard_output PATH override these per run.
dashboard: true                       # run the live dashboard (writes a PNG every ~0.5 s)
viewer: true                          # open a feh window on that PNG (needs DISPLAY + feh; else skipped)
dashboard_output: /tmp/dashboard.png  # PNG the dashboard writes and feh shows

overrides:
  # --- disturbances / domain randomisation (EventCfg) ---
  env.events.push_robot_force.params.max_force: 40.0        # [AGGR] N per axis (realistic: 15)
  env.events.push_robot_force.params.max_torque: 5.0        # [AGGR] Nm (realistic: 2)
  env.events.push_robot.params.max_velocity: 0.5
  env.events.robot_mass.params.mass_distribution_params: [-5.0, 5.0]          # [AGGR] kg (realistic: +-2)
  env.events.robot_com.params.max_xyz: [0.10, 0.08, 0.15]                     # [AGGR] m (realistic: 0.06,0.05,0.08)
  env.events.actuator_gains.params.stiffness_distribution_params: [0.9, 1.1]
  env.events.actuator_gains.params.damping_distribution_params: [0.9, 1.1]
  env.events.joint_armature.params.armature_distribution_params: [0.5, 2.0]   # [AGGR] x nominal (realistic: 0.75,1.5)
  env.events.joint_friction.params.friction_distribution_params: [0.0, 0.1]
  env.events.physics_material.params.static_friction_range: [0.5, 1.2]
  env.events.physics_material.params.dynamic_friction_range: [0.4, 1.0]

  # --- difficulty curriculum ---
  env.curriculum.difficulty.params.step: 0.05               # [AGGR] faster ramp (realistic: 0.025)
  env.curriculum.difficulty.params.up_thresh: 0.8
  env.curriculum.difficulty.params.down_thresh: 0.4
  env.curriculum.difficulty.params.dwell_steps: 6000
  env.curriculum.difficulty.params.settle_steps: 2000
  env.curriculum.difficulty.params.min_episodes: 500

  # --- reward weights (full set; [AGGR] marks the softer pre-iter4 posture/fall weights) ---
  env.rewards.track_lin_vel_xy_exp.weight: 6.0
  env.rewards.track_lin_vel_xy_broad.weight: 4.0
  env.rewards.track_ang_vel_z_exp.weight: 1.2
  env.rewards.track_ang_vel_z_broad.weight: 0.8
  env.rewards.standing_when_commanded.weight: -4.0
  env.rewards.track_ang_vel_deficit.weight: -0.5
  env.rewards.track_pitch_exp.weight: 3.0
  env.rewards.track_lean_exp.weight: 3.0
  env.rewards.lin_vel_z_l2.weight: -2.0
  env.rewards.ang_vel_xy_l2.weight: -0.05
  env.rewards.dof_torques_l2.weight: -3.0e-5
  env.rewards.dof_acc_l2.weight: -5.0e-7
  env.rewards.action_rate_l2.weight: -0.03
  env.rewards.dof_vel_l2.weight: -1.0e-4
  env.rewards.action_jerk_l2.weight: -0.03
  env.rewards.joint_torque_rate_l2.weight: -1.0e-3
  env.rewards.is_alive.weight: 2.0
  env.rewards.termination_penalty.weight: -500.0           # [AGGR] softer fall penalty (realistic: -750)
  env.rewards.undesired_contacts.weight: -1.0
  env.rewards.undesired_contacts_arm.weight: -1.0
  env.rewards.height_penalty.weight: -12.0                 # [AGGR] (realistic: -15)
  env.rewards.hip_crossing.weight: -0.5
  env.rewards.foot_sliding.weight: -1.0
  env.rewards.gait_coordination.weight: 1.0
  env.rewards.stand_still.weight: 4.0                      # [AGGR] (realistic: 5.0)
  env.rewards.foot_lift.weight: 0.5
  env.rewards.dof_pos_limits.weight: -1.0
  env.rewards.joint_deviation.weight: -0.005

  # --- commands ---
  env.commands.base_velocity.rel_standing_envs: 0.12       # [AGGR] (realistic: 0.2)
  env.commands.base_velocity.resampling_time_range: [10.0, 10.0]
  env.commands.base_velocity.rel_low_speed_envs: 0.35
  env.commands.base_velocity.low_speed_max: 0.3
  env.commands.base_velocity.ranges.lin_vel_x: [-1.0, 1.0]
  env.commands.base_velocity.ranges.lin_vel_y: [-1.0, 1.0]
  env.commands.base_velocity.ranges.ang_vel_z: [-1.0, 1.0]
  env.commands.base_velocity.ranges.ang_pos_x: [-0.3, 0.3]
  env.commands.base_velocity.ranges.ang_pos_y: [-0.6, 0.6]

  # --- agent / PPO ---
  agent.algorithm.learning_rate: 1.0e-3
  agent.algorithm.gamma: 0.99
  agent.algorithm.lam: 0.95
  agent.algorithm.entropy_coef: 0.0075
  agent.algorithm.clip_param: 0.2
  agent.algorithm.value_loss_coef: 0.5
  agent.algorithm.desired_kl: 0.01
  agent.algorithm.num_learning_epochs: 5
  agent.algorithm.num_mini_batches: 4
  agent.save_interval: 100

phases:
  # Phase 1 -- clean warm-up (aggressive runs also started from a stable gait before the strong pushes).
  - name: clean
    iterations: 10000
    batched: true
    batch_iterations: 2000
    overrides:
      env.events.push_robot_force.params.max_force: 10.0
      env.events.push_robot_force.params.max_torque: 2.0

  # Phase 2 -- aggressive: uses the baseline above unchanged (full pre-iter4 magnitudes + softer weights).
  - name: aggressive
    iterations: 15000
    batched: true
    batch_iterations: 2000
    overrides: {}
